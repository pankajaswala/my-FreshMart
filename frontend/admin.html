<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart Admin Panel</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body{
            font-family:Arial,sans-serif;
            background:#f4f4f4;
        }

        header{
            background:#2e7d32;
            color:white;
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .dashboard{
            padding:30px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 5px 10px rgba(0,0,0,.1);
            text-align:center;
        }

        .card h2{
            color:#2e7d32;
            margin-top:10px;
        }

        .form-box{
            background:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:30px;
            box-shadow:0 5px 10px rgba(0,0,0,.1);
        }

        .form-box h2{
            margin-bottom:20px;
        }

        .form-box input,
        .form-box select,
        .form-box textarea{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:6px;
        }

        .form-box textarea{
            height:100px;
            resize:none;
        }

        .form-box button{
            width:100%;
            padding:12px;
            background:#2e7d32;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:18px;
        }

        .form-box button:hover{
            background:#1b5e20;
        }

        #logoutBtn{
            background:red;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:5px;
            cursor:pointer;
        }

        #adminProducts{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .product-card{
            background:white;
            padding:15px;
            border-radius:10px;
            box-shadow:0 5px 10px rgba(0,0,0,.1);
            text-align:center;
        }

        .product-card img{
            width:150px;
            height:150px;
            object-fit:cover;
            border-radius:10px;
        }

        .product-card button{
            margin-top:10px;
            background:red;
            color:white;
            border:none;
            padding:10px;
            cursor:pointer;
            border-radius:5px;
        }

    </style>

</head>

<body>

<header>

    <h1>FreshMart Admin Panel</h1>

    <button id="logoutBtn">
        Logout
    </button>

</header>

<div class="dashboard">

    <div class="cards">

        <div class="card">
            <h3>Total Products</h3>
            <h2 id="totalProducts">0</h2>
        </div>

        <div class="card">
            <h3>Total Orders</h3>
            <h2 id="totalOrders">0</h2>
        </div>

    </div>

    <div class="form-box">

        <h2>Add New Product</h2>

        <form id="productForm">

            <input
                type="text"
                id="name"
                placeholder="Product Name"
                required>

            <select id="category" required>

                <option value="">Select Category</option>

                <option value="vegetables">Vegetables</option>

                <option value="fruits">Fruits</option>

                <option value="dairy">Dairy</option>

                <option value="grocery">Grocery</option>

            </select>

<input
    type="number"
    id="weight"
    placeholder="Weight"
    required>

<select id="unit" required>
    <option value="g">Gram (g)</option>
    <option value="kg">Kilogram (kg)</option>
    <option value="ml">ML</option>
    <option value="ltr">Liter</option>
    <option value="piece">Piece</option>
    <option value="dozen">Dozen</option>
</select>

<input
    type="number"
    id="price"
    placeholder="Price"
    required>

<input
    type="number"
    id="stock"
    placeholder="Stock Quantity"
    required>
<input
    type="text"
    id="image"
    placeholder="Image URL"
    required>

            <textarea
                id="description"
                placeholder="Product Description"></textarea>

            <button type="submit">
                Add Product
            </button>

        </form>

    </div>
        <h2>All Products</h2>

    <div id="adminProducts">

        <!-- Products will load here -->

    </div>

<!-- ========================= -->
<!-- MANAGE ORDERS -->
<!-- ========================= -->

<h2 style="margin-top:40px;">Manage Orders</h2>

<div class="form-box">

<table style="width:100%; border-collapse:collapse;">

<thead>

<tr>

    <th>Order No</th>

    <th>Customer Details</th>

    <th>Products</th>

    <th>Total Price</th>

    <th>Status</th>

    <th>Date</th>

    <th>Action</th>

</tr>

</thead>

<tbody id="orderTable">

</tbody>

</table>

</div>




</div>

<script src="admin.js"></script>

</body>
</html>
