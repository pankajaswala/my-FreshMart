<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f5f5f5;
        }

        .login-container{
            width:400px;
            margin:80px auto;
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        .login-container h2{
            text-align:center;
            color:green;
            margin-bottom:25px;
        }

        .login-container input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
            box-sizing:border-box;
        }

        .login-container button{
            width:100%;
            padding:12px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        .login-container button:hover{
            background:darkgreen;
        }

        .login-container p{
            text-align:center;
            margin-top:20px;
        }

        .login-container a{
            color:green;
            text-decoration:none;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="login-container">

    <h2>FreshMart Login</h2>

    <form id="loginForm">

        <input
        type="email"
        id="email"
        placeholder="Enter Email"
        required>

        <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="register.html">Register</a>
    </p>

</div>

<script src="login.js"></script>

</body>
</html>
