<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Orders</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:20px;
}

h2{
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
    vertical-align:top;
}

th{
    background:#28a745;
    color:white;
}

button{
    padding:8px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    color:white;
}

.complete{
    background:green;
}

.completed{
    color:green;
    font-weight:bold;
}

.pending{
    color:red;
    font-weight:bold;
}

.product{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

.product img{
    width:60px;
    height:60px;
    object-fit:cover;
    border-radius:5px;
}

</style>

</head>

<body>

<h2>Manage Orders</h2>

<table>

<thead>

<tr>
    <th>Order No</th>
    <th>Customer</th>
    <th>Phone</th>
    <th>Address</th>
    <th>Products</th>
    <th>Total Price</th>
    <th>Status</th>
    <th>Date</th>
    <th>Action</th>
</tr>

</thead>

<tbody id="orderTable">

</tbody>

</table>

<script>

async function loadOrders(){

    try{

        const res = await fetch("http://http://localhost:5000/api/orders");

        const orders = await res.json();

        console.log(orders);

        const table = document.getElementById("orderTable");

        table.innerHTML="";

        orders.forEach((order, index) => {

            let productsHTML="";

            order.products.forEach(item=>{

                productsHTML += `

                <div class="product">

                    <img src="${item.productId.image}" alt="">

                    <div>

                        <strong>${item.productId.name}</strong><br>

                        Price : ₹${item.productId.price}<br>

                        Qty : ${item.quantity}

                    </div>

                </div>

                <hr>

                `;

            });
table.innerHTML += `

<tr>

    <td>#${1001 + index}</td>

    <td>
        <strong>${order.userId.name}</strong><br>
        ${order.userId.email}
    </td>

    <td>${order.phone || "-"}</td>

    <td>${order.address || "-"}</td>

    <td>${productsHTML}</td>

    <td>₹${order.totalPrice}</td>

    <td class="${order.status==="Completed" ? "completed" : "pending"}">
        ${order.status}
    </td>

    <td>${new Date(order.createdAt).toLocaleDateString()}</td>

    <td>
        ${
            order.status==="Pending"
            ? `<button class="complete" onclick="completeOrder('${order._id}')">
                    Complete
               </button>`
            : "Completed"
        }
    </td>

</tr>

`;

        });

    }

    catch(error){

        console.log(error);

        alert("Unable To Load Orders");

    }

}

async function completeOrder(id){

    if(!confirm("Mark this order completed?")) return;

    try{

        const res = await fetch(`http://http://localhost:5000/api/orders/${id}`,{

            method:"PUT",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                status:"Completed"

            })

        });

        const data = await res.json();

        alert(data.message);

        loadOrders();

    }

    catch(error){

        console.log(error);

    }

}

loadOrders();

</script>

</body>
</html>
