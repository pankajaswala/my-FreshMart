<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshMart Products</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<header>

<div class="logo">
   <img src="logo.png" alt="FreshMart Logo" width="70" height="50">
FreshMart
</div>

<nav>
<a href="index.html">Home</a>
<a href="product.html">Products</a>
<a href="#contact">Contact</a>
</nav>

<div class="header-icons">

<input
type="text"
id="searchInput"
placeholder="Search Products">

<a href="cart.html" class="cart-icon">
<i class="fas fa-shopping-cart"></i>
<span id="cartCount">0</span>
</a>

</div>

</header>

<section class="page-banner">
<h1>Our Products</h1>
<p>Fresh & Affordable Everyday</p>
</section>

<section class="filters">

<button class="filter-btn active" data-filter="all">All</button>
<button class="filter-btn" data-filter="vegetables">Vegetables</button>
<button class="filter-btn" data-filter="fruits">Fruits</button>
<button class="filter-btn" data-filter="dairy">Dairy</button>
<button class="filter-btn" data-filter="grocery">Grocery</button>

</section>

<section class="product-grid" id="productGrid">


    <!-- Yahan tumhare saare product-card the
         Tomato, Potato, Apple, Mango, Milk, Dal, etc. -->

</section>

<script src="script.js"></script>

</body>
</html>
