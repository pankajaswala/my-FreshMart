<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart Cart</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<header>

    <div class="logo">
        <i class="fas fa-shopping-basket"></i>
        FreshMart
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="product.html">Products</a>
        <a href="cart.html">Cart</a>
    </nav>

</header>

<section class="cart-page">

    <h1>Your Shopping Cart</h1>

    <div class="cart-container">

        <div class="cart-items" id="cartItems"></div>

        <div class="cart-summary">

            <h2>Order Summary</h2>

            <div id="orderSummary"></div>

            <hr>

            <h3>Delivery Details</h3>


            <input
                type="text"
                id="customerName"
                placeholder="Enter Full Name"
                style="width:100%; padding:10px; margin-bottom:10px;"
                required
            >

            <input
                type="text"
                id="phone"
                placeholder="Enter Mobile Number"
                style="width:100%; padding:10px; margin-bottom:10px;"
                required
            >

            <textarea
                id="address"
                rows="4"
                placeholder="Enter Delivery Address"
                style="width:100%; padding:10px; margin-bottom:15px;"
                required
            ></textarea>

            <hr>

            <h3>Payment Method</h3>

            <label>
                <input type="radio" name="payment" value="Cash On Delivery" checked>
                Cash On Delivery
            </label>

            <br><br>

            <label>
                <input type="radio" name="payment" value="UPI">
                UPI
            </label>

            <br><br>

            <label>
                <input type="radio" name="payment" value="Debit Card">
                Debit / Credit Card
            </label>

            <br><br>

            <label>
                <input type="radio" name="payment" value="Net Banking">
                Net Banking
            </label>

            <br><br>

            <button class="btn checkout-btn">
                Proceed To Checkout
            </button>

        </div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
