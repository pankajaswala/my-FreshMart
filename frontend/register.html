<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart Register</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f5f5f5;
        }

        .register-container{
            width:400px;
            margin:60px auto;
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
            font-size:18px;
        }

        h2{
            text-align:center;
            color:green;
        }

        p{
            text-align:center;
        }
    </style>

</head>
<body>

<div class="register-container">

<h2>Create Account</h2>

<form id="registerForm">

<input
type="text"
id="name"
placeholder="Enter Name"
required>

<input
type="email"
id="email"
placeholder="Enter Email"
required>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

<button type="submit">
Register
</button>

</form>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

<script src="register.js"></script>

</body>
</html>
